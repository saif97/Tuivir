name: Prepare release

# Opens a pull request that sets the Cargo package version. Merging it makes
# the Publish release workflow tag and publish that version. RELEASE_PR_TOKEN is
# a fine-grained token limited to this repository with Contents and Pull
# requests write access. The built-in token keeps read access only, so the
# "Allow GitHub Actions to create and approve pull requests" setting stays off.
"on":
  workflow_dispatch:
    inputs:
      version:
        description: Stable version to release, such as 0.3.0
        required: true
        type: string

permissions:
  contents: read

jobs:
  prepare:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ inputs.version }}
      GH_TOKEN: ${{ secrets.RELEASE_PR_TOKEN }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          token: ${{ secrets.RELEASE_PR_TOKEN }}

      - name: Verify the version is newer than the latest release
        run: |
          set -euo pipefail
          latest="$(gh release view --json tagName --jq '.tagName | ltrimstr("v")')"
          status="$(bash scripts/release-status "$VERSION" "$latest")"
          [[ "$status" = new ]] || {
            echo "v$VERSION is already released" >&2
            exit 1
          }

      - name: Set the release version
        run: bash scripts/set-release-version "$VERSION"

      - name: Open the release pull request
        run: |
          bash scripts/open-pull-request master "release/v$VERSION" \
            "Release v$VERSION" \
            "Merging this pull request publishes Tuivir v$VERSION."
