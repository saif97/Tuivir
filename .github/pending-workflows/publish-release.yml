name: Publish release

# Publishes a release when a Cargo.toml version change reaches master and that
# version is newer than the highest stable vX.Y.Z tag. The release tag is
# created on the exact commit the artifacts were built from.
"on":
  push:
    branches:
      - master
    paths:
      - Cargo.toml

permissions:
  contents: read

concurrency:
  group: publish-release
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
    env:
      GH_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      # Compares the Cargo.toml version with the highest stable vX.Y.Z tag:
      # newer publishes it, equal skips the release, older fails the run.
      # Tags are used, not the latest release, so that a tag pushed before the
      # merge stops the release instead of moving it to another commit.
      - name: Check that the Cargo version is newer than the latest release tag
        id: release
        run: |
          set -euo pipefail
          version="$(bash scripts/release-version)"
          latest="$(gh api "repos/$GH_REPO/git/matching-refs/tags/v" --paginate --jq '.[].ref | ltrimstr("refs/tags/")' | bash scripts/latest-release)"
          status="$(bash scripts/release-status "$version" "$latest")"
          if [[ "$status" = new ]]; then
            echo "version=$version" >> "$GITHUB_OUTPUT"
          else
            echo "v$version is already released"
          fi

  artifacts:
    needs: validate
    if: needs.validate.outputs.version != ''
    permissions:
      contents: read
    uses: ./.github/workflows/build-release-artifacts.yml
    with:
      version: ${{ needs.validate.outputs.version }}

  publish:
    needs:
      - validate
      - artifacts
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.validate.outputs.version }}
    steps:
      - name: Download verified release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: tuivir-v${{ needs.validate.outputs.version }}-release-artifacts
          path: release-artifacts

      - name: Publish the GitHub Release
        run: |
          set -euo pipefail
          gh release create "v$VERSION" release-artifacts/* \
            --generate-notes \
            --latest \
            --target "$GITHUB_SHA" \
            --title "Tuivir v$VERSION"
