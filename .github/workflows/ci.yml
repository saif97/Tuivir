name: CI

"on":
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install "$(awk -F '"' '$1 ~ /^channel/ { print $2 }' rust-toolchain.toml)" --profile minimal --component rustfmt --component clippy
      - name: Install pinned actionlint
        run: |
          curl --fail --location --silent --show-error \
            --output actionlint.tar.gz \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  actionlint.tar.gz" | sha256sum --check
          tar --extract --gzip --file actionlint.tar.gz
      - name: Validate GitHub Actions syntax
        run: ./actionlint
      - name: Validate workflow definitions
        run: cargo test --locked --test ci_workflow

  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install "$(awk -F '"' '$1 ~ /^channel/ { print $2 }' rust-toolchain.toml)" --profile minimal --component rustfmt --component clippy
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run Clippy
        run: cargo clippy --all-targets --all-features --locked -- -D warnings
      - name: Run tests
        run: cargo test --all-targets --all-features --locked
