name: Publish release

"on":
  workflow_dispatch:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: publish-release
  cancel-in-progress: false

jobs:
  validate:
    if: github.repository == 'saif97/Tuivir'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
      published: ${{ steps.release.outputs.published }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate the release tag
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF_TYPE" = tag
          version=$(bash scripts/release-version "$GITHUB_REF_NAME")
          git merge-base --is-ancestor "$GITHUB_SHA" origin/master
          echo "version=$version" >> "$GITHUB_OUTPUT"
          published=$(python3 scripts/release.py published "$GITHUB_REF_NAME")
          echo "published=$published" >> "$GITHUB_OUTPUT"

  checks:
    needs: validate
    uses: ./.github/workflows/ci.yml

  artifacts:
    needs: [validate, checks]
    if: needs.validate.outputs.published != 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/build-release-artifacts.yml
    with:
      version: ${{ needs.validate.outputs.version }}

  publish:
    if: >-
      !cancelled() && needs.validate.result == 'success' && needs.checks.result == 'success' &&
      (needs.artifacts.result == 'success' || needs.validate.outputs.published == 'true')
    needs:
      - validate
      - checks
      - artifacts
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Reuse the published release
        if: needs.validate.outputs.published == 'true'
        run: printf 'Reusing immutable release `%s`; no binaries will be rebuilt.\n' "$GITHUB_REF_NAME" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        if: needs.validate.outputs.published != 'true'
        with:
          persist-credentials: false
      - name: Download verified release artifacts
        if: needs.validate.outputs.published != 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: tuivir-v${{ needs.validate.outputs.version }}-release-artifacts
          path: release-artifacts

      - name: Publish the GitHub Release
        if: needs.validate.outputs.published != 'true'
        run: python3 scripts/release.py publish "$GITHUB_REF_NAME" release-artifacts

  homebrew:
    needs: [validate, publish]
    if: ${{ !cancelled() && needs.publish.result == 'success' }}
    uses: ./.github/workflows/update-homebrew.yml
    with:
      tag: v${{ needs.validate.outputs.version }}
