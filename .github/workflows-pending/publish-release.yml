name: Publish release

"on":
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Validate the release tag
        id: release
        run: echo "version=$(bash scripts/release-version "$GITHUB_REF_NAME")" >> "$GITHUB_OUTPUT"

  artifacts:
    needs: validate
    permissions:
      contents: read
    uses: ./.github/workflows/build-release-artifacts.yml
    with:
      version: ${{ needs.validate.outputs.version }}

  publish:
    needs:
      - validate
      - artifacts
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Download verified release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: tuivir-v${{ needs.validate.outputs.version }}-release-artifacts
          path: release-artifacts

      - name: Publish the GitHub Release
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" release-artifacts/* \
            --generate-notes \
            --latest \
            --title "Tuivir $GITHUB_REF_NAME" \
            --verify-tag
