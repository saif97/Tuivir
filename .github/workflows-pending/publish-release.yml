name: Publish release

"on":
  workflow_dispatch:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: publish-release
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate the release tag
        id: release
        run: |
          test "$GITHUB_REF_TYPE" = tag
          version=$(bash scripts/release-version "$GITHUB_REF_NAME")
          git merge-base --is-ancestor "$GITHUB_SHA" origin/master
          echo "version=$version" >> "$GITHUB_OUTPUT"

  checks:
    needs: validate
    uses: ./.github/workflows/ci.yml

  artifacts:
    needs: [validate, checks]
    permissions:
      contents: read
    uses: ./.github/workflows/build-release-artifacts.yml
    with:
      version: ${{ needs.validate.outputs.version }}

  publish:
    needs:
      - validate
      - artifacts
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Download verified release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: tuivir-v${{ needs.validate.outputs.version }}-release-artifacts
          path: release-artifacts

      - name: Publish the GitHub Release
        run: |
          set -euo pipefail
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --draft --generate-notes \
              --title "Tuivir $GITHUB_REF_NAME" --verify-tag
          fi
          if [[ "$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft)" = true ]]; then
            gh release upload "$GITHUB_REF_NAME" release-artifacts/* --clobber
            gh release edit "$GITHUB_REF_NAME" --draft=false
          fi

  homebrew:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: saif97/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap
          persist-credentials: false
      - name: Read the published checksums
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release download "$GITHUB_REF_NAME" --pattern SHA256SUMS --dir release
      - name: Update the formula
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          python3 scripts/update-homebrew.py "$GITHUB_REF_NAME" release/SHA256SUMS tap/Formula/tuivir.rb
          git -C tap diff --quiet && exit 0
          gh auth setup-git
          git -C tap config user.name 'github-actions[bot]'
          git -C tap config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C tap add Formula/tuivir.rb
          git -C tap commit -m "Update Tuivir to $GITHUB_REF_NAME"
          git -C tap push origin HEAD:main
