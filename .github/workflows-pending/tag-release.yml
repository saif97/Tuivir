name: Tag merged release

"on":
  pull_request_target:
    types: [closed]
    branches: [master]

permissions:
  contents: read

concurrency:
  group: tag-release-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  validate:
    if: >-
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.event.pull_request.head.ref, 'release/v')
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      commit: ${{ steps.release.outputs.commit }}
    steps:
      # pull_request_target is deliberate: run trusted default-branch code only.
      # Never check out or execute the PR head in this workflow.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify the merged PR contains only the version bump
        id: release
        env:
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          release=$(python3 scripts/release.py merged-tag "$GITHUB_EVENT_PATH" --repo "$GH_REPO")
          jq -r 'to_entries[] | "\(.key)=\(.value)"' <<< "$release" >> "$GITHUB_OUTPUT"

  tag:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ needs.validate.outputs.tag }}
      RELEASE_COMMIT: ${{ needs.validate.outputs.commit }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false
      - name: Create the tag and explicitly start publication
        run: |
          set -euo pipefail
          gh auth setup-git
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python3 scripts/release.py tag "$RELEASE_TAG" "$RELEASE_COMMIT"
          # A tag pushed with GITHUB_TOKEN does not trigger another push workflow.
          gh workflow run publish-release.yml --ref "$RELEASE_TAG"
          printf 'Publication requested for `%s` at `%s`.\n' "$RELEASE_TAG" "$RELEASE_COMMIT" >> "$GITHUB_STEP_SUMMARY"
