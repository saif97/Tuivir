name: Update Homebrew

"on":
  workflow_dispatch:
    inputs:
      tag:
        description: Published stable release tag to deliver (for example v0.3.0)
        required: true
        type: string
  workflow_call:
    inputs:
      tag:
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: homebrew-tuivir
  cancel-in-progress: false

jobs:
  verify:
    if: >-
      github.repository == 'saif97/Tuivir' &&
      (github.ref == 'refs/heads/master' || github.ref_type == 'tag')
    runs-on: macos-15
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: master
          persist-credentials: false
      - name: Verify published assets and generate the formula
        run: |
          set -euo pipefail
          python3 scripts/release.py download "$RELEASE_TAG" release-artifacts
          mkdir release-formula
          python3 scripts/release.py formula "$RELEASE_TAG" release-artifacts release-formula/tuivir.rb

      - name: Install and test the staged formula
        run: |
          set -euo pipefail
          brew tap-new --no-git saif97/release-check
          cp release-formula/tuivir.rb "$(brew --repository saif97/release-check)/Formula/tuivir.rb"
          brew install --formula saif97/release-check/tuivir
          brew test saif97/release-check/tuivir

      - name: Upload the tested formula
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: homebrew-${{ inputs.tag }}
          path: release-formula/tuivir.rb
          if-no-files-found: error
          retention-days: 7

  update:
    needs: verify
    runs-on: ubuntu-latest
    environment: homebrew
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: master
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: homebrew-${{ inputs.tag }}
          path: release-formula
      - name: Commit the tested formula to the tap
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "$GH_TOKEN" ]]; then
            echo '::error::Set HOMEBREW_TAP_TOKEN in the homebrew environment (tap Contents: read and write only).'
            exit 1
          fi
          python3 scripts/release.py update-tap release-formula/tuivir.rb
