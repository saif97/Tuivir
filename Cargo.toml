[package]
name = "virtui"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/saif97/virtui"
description = "A terminal environment for inspecting and operating resources managed by local virtualization and container providers."
publish = false

[dependencies]
crossterm = "0.29.0"
ratatui = "0.30.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["macros", "process", "rt-multi-thread", "sync", "test-util", "time"] }
toml = "0.8"
unicode-width = "0.2"
