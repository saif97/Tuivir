[package]
name = "tuivir"
version = "0.2.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/saif97/Tuivir"
description = "A terminal environment for inspecting and operating resources managed by local virtualization and container providers."
publish = false

[dependencies]
alacritty_terminal = "0.26.0"
crossterm = "0.29.0"
libc = "0.2"
ratatui = "0.30.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["macros", "process", "rt-multi-thread", "sync", "test-util", "time"] }
toml = "0.8"
unicode-width = "0.2"
